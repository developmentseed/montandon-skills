# Nginx reverse proxy for the Montandon Chainlit app.
#
# Setup (Ubuntu/Debian, certbot already installed):
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ask.montandondata.org
#   sudo ln -s /etc/nginx/sites-available/ask.montandondata.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ask.montandondata.org
#
# certbot rewrites this file in place to add the SSL server block — after that,
# treat this checked-in copy as the pre-certbot template, not a mirror of what's live.
#
# Assumes the chainlit process is already running on 127.0.0.1:8300, e.g. via
# `uv run --env-file .env chainlit run app.py --port 8300`.

server {
    listen 80;
    listen [::]:80;
    server_name ask.montandondata.org;

    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;

        # Chainlit uses Socket.IO over websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # keep long-lived websocket connections open
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
